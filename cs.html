<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TX Dashboard - CS View</title>
<style>
:root {
  --bg: #f8fafc; --bg-card: #ffffff; --border: #e2e8f0; --text: #1e293b;
  --green: #059669; --amber: #d97706; --red: #dc2626; --blue: #2563eb;
  --text-muted: #64748b; --bg-hover: #f1f5f9; --bg-active: #e2e8f0;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size:13px; background:var(--bg); color:var(--text); line-height:1.5; }

/* NAV — NOT sticky */
.nav { display:flex; align-items:center; gap:16px; padding:12px 24px; background:var(--bg-card); border-bottom:1px solid var(--border); }
.nav-title { font-weight:700; font-size:15px; }
.nav-links { display:flex; gap:8px; margin-left:auto; }
.nav-links a { font-size:12px; color:var(--blue); text-decoration:none; padding:4px 10px; border:1px solid var(--border); border-radius:4px; }
.nav-links a:hover { background:var(--bg-hover); }

/* TABS */
.tabs { display:flex; gap:0; padding:0 24px; background:var(--bg-card); border-bottom:2px solid var(--border); }
.tab { padding:10px 20px; cursor:pointer; font-size:13px; font-weight:600; border-bottom:2px solid transparent; color:var(--text-muted); margin-bottom:-2px; transition:all 0.15s; user-select:none; }
.tab.active { color:var(--blue); border-bottom-color:var(--blue); }
.tab:hover { color:var(--text); background:var(--bg-hover); }
.tab-content { display:none; padding:16px 24px; }
.tab-content.active { display:block; }

/* FILTERS */
.filters { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:12px; padding:10px 14px; background:var(--bg-card); border:1px solid var(--border); border-radius:8px; }
.filters select, .filters input[type="text"] { font-size:12px; padding:6px 10px; border:1px solid var(--border); border-radius:6px; background:var(--bg-card); outline:none; }
.filters input[type="text"] { width:220px; }
.filters input[type="text"]:focus { border-color:var(--blue); box-shadow:0 0 0 2px rgba(37,99,235,0.1); }
.filters label { font-size:12px; color:var(--text-muted); display:flex; align-items:center; gap:4px; cursor:pointer; }
.filters label input[type="checkbox"] { cursor:pointer; }
.filter-count { font-size:11px; color:var(--text-muted); margin-left:auto; }

/* TABLE */
.table-wrap { overflow-x:auto; border:1px solid var(--border); border-radius:8px; background:var(--bg-card); }
table { width:100%; border-collapse:collapse; font-size:12px; }
thead { position:sticky; top:0; z-index:50; }
th { background:#f1f5f9; padding:8px 10px; text-align:left; font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:0.5px; color:var(--text-muted); border-bottom:2px solid var(--border); white-space:nowrap; cursor:pointer; user-select:none; }
th:hover { background:var(--bg-active); }
th .sort-arrow { font-size:10px; margin-left:3px; opacity:0.4; }
th.sorted .sort-arrow { opacity:1; color:var(--blue); }
td { padding:7px 10px; border-bottom:1px solid var(--border); vertical-align:top; }
tr:hover { background:var(--bg-hover); }
tr.total-row { background:#f1f5f9; font-weight:700; border-top:2px solid var(--border); }
tr.total-row:hover { background:#f1f5f9; }

/* EXPAND */
.expand-btn { cursor:pointer; font-size:11px; color:var(--text-muted); width:20px; text-align:center; transition:transform 0.15s; display:inline-block; }
.expand-btn.open { transform:rotate(90deg); }
.expand-row { display:none; }
.expand-row.open { display:table-row; }
.expand-cell { padding:12px 16px 12px 36px; background:#fafbfc; border-bottom:1px solid var(--border); }
.expand-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(280px, 1fr)); gap:12px; }
.expand-section { background:var(--bg-card); border:1px solid var(--border); border-radius:6px; padding:10px 12px; }
.expand-section h4 { font-size:11px; text-transform:uppercase; letter-spacing:0.5px; color:var(--text-muted); margin-bottom:6px; }
.expand-section .detail-row { display:flex; justify-content:space-between; font-size:12px; padding:2px 0; }
.expand-section .detail-label { color:var(--text-muted); }

/* BADGES */
.badge { display:inline-block; padding:2px 8px; border-radius:10px; font-size:10px; font-weight:600; letter-spacing:0.3px; }
.badge-TA { background:#dbeafe; color:#1e40af; }
.badge-IMPL { background:#fef3c7; color:#92400e; }
.badge-P1 { background:#dcfce7; color:#166534; }
.badge-CS_P2 { background:#e0e7ff; color:#3730a3; }
.badge-WATCH { background:#f1f5f9; color:#475569; }
.badge-ECOSYSTEM { background:#f5f3ff; color:#6d28d9; }
.badge-CS_TRACKED { background:#fce7f3; color:#9d174d; }
.badge-ct { background:#f1f5f9; color:var(--text-muted); font-size:10px; padding:1px 6px; border-radius:4px; border:1px solid var(--border); }

/* STAGE BADGES */
.stage { display:inline-block; padding:2px 6px; border-radius:4px; font-size:10px; font-weight:600; }
.stage-SCALE, .stage-STRONG, .stage-HEALTHY { background:#dcfce7; color:#166534; }
.stage-HABIT, .stage-GROWING { background:#dbeafe; color:#1d4ed8; }
.stage-ACTIVATING, .stage-MINIMAL { background:#fef3c7; color:#92400e; }
.stage-CONNECTIONS_NO_BUY, .stage-ESHOP_NO_FEATURES { background:#fed7aa; color:#9a3412; }
.stage-NO_CONNECTIONS, .stage-NO_ESHOP, .stage-NO_ONLINE_SALES { background:#fecaca; color:#991b1b; }

/* CONFIG INLINE */
.check-ok { color:var(--green); font-weight:700; }
.check-fail { color:var(--red); font-weight:700; }

/* SUB-TABS (enablement) */
.sub-tabs { display:flex; gap:0; margin-bottom:16px; border-bottom:1px solid var(--border); }
.sub-tab { padding:8px 16px; cursor:pointer; font-size:13px; color:var(--text-muted); border-bottom:2px solid transparent; }
.sub-tab.active { color:var(--blue); border-bottom-color:var(--blue); }
.sub-content { display:none; }
.sub-content.active { display:block; }

/* ENABLEMENT CARDS */
.en-card { background:var(--bg-card); border:1px solid var(--border); border-radius:8px; padding:14px; margin-bottom:10px; }
.en-card h4 { font-size:13px; margin-bottom:6px; }
.en-card p { font-size:12px; color:var(--text-muted); margin-bottom:4px; }
.en-tag { display:inline-block; font-size:10px; padding:2px 6px; border-radius:3px; margin-right:4px; }
.en-tag.fix5 { background:#dcfce7; color:#166534; }
.en-tag.approval { background:#fef3c7; color:#92400e; }
.en-list { list-style:none; padding:0; }
.en-list li { padding:8px 0; border-bottom:1px solid var(--border); font-size:12px; line-height:1.5; }
.en-list li:last-child { border-bottom:none; }
.en-num { display:inline-block; width:20px; height:20px; border-radius:50%; background:var(--blue); color:#fff; text-align:center; line-height:20px; font-size:10px; font-weight:700; margin-right:8px; }

/* DEFINITIONS */
.def-section { margin-bottom:20px; }
.def-section h3 { font-size:14px; margin-bottom:10px; padding-bottom:6px; border-bottom:1px solid var(--border); }
.def-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:10px; }
.def-card { background:var(--bg-card); border:1px solid var(--border); border-radius:8px; padding:12px; }
.def-card h4 { font-size:13px; margin-bottom:4px; color:var(--blue); }
.def-card p { font-size:12px; color:var(--text-muted); }
.abbr-grid { display:grid; grid-template-columns:100px 1fr; gap:4px 12px; font-size:12px; }
.abbr-key { font-weight:700; }

/* TRAFFIC LIGHTS */
.tl { display:inline-block; font-size:14px; width:22px; text-align:center; }
.tl-green { color:var(--green); }
.tl-amber { color:var(--amber); }
.tl-red { color:var(--red); }

/* PRODUCT BADGES */
.prod-badge { display:inline-block; padding:1px 5px; border-radius:3px; font-size:9px; font-weight:700; letter-spacing:0.3px; margin-right:2px; }
.prod-core { background:#dbeafe; color:#1e40af; }
.prod-esuite { background:#e0e7ff; color:#3730a3; }
.prod-proc { background:#dcfce7; color:#166534; }
.prod-eshop { background:#fef3c7; color:#92400e; }
.prod-pay { background:#fce7f3; color:#9d174d; }

/* PRIORITY MAPPED */
.badge-P0 { background:#fecaca; color:#991b1b; }
.badge-P1 { background:#dcfce7; color:#166534; }
.badge-P2 { background:#e0e7ff; color:#3730a3; }
.badge-P3 { background:#f1f5f9; color:#475569; }

/* OPP COUNT */
.opp-count { display:inline-block; min-width:18px; text-align:center; padding:1px 5px; border-radius:10px; font-size:10px; font-weight:700; }
.opp-count.has-opps { background:#fef3c7; color:#92400e; }
.opp-count.no-opps { background:#f1f5f9; color:#94a3b8; }

/* RESPONSIVE */
@media (max-width: 768px) {
  .nav { flex-direction:column; gap:6px; align-items:flex-start; }
  .filters { flex-direction:column; }
  .filters input[type="text"] { width:100%; }
  .expand-grid { grid-template-columns:1fr; }
}
</style>
</head>
<body>

<div class="nav">
  <span class="nav-title">TX Dashboard / CS</span>
  <div class="nav-links">

<div class="tab-content" id="tab-definitions"></div>

<script>
// ─── DATA LOAD ──────────────────────────────────────────────
var ACCOUNTS=[], METRICS={}, CONFIG={}, BUNCHES={}, SFDC=[], CHRISTINE={}, DEFINITIONS={};
var BUYERS=[], SELL_BY_CHANNEL={}, BUYER_CONCENTRATION={}, REPEAT_RATE={}, SUPPLY_MATRIX={};

async function loadData() {
  var base = 'data/';
  var results = await Promise.all([
    fetch(base+'accounts.json').then(function(r){return r.json();}),
    fetch(base+'metrics.json').then(function(r){return r.json();}),
    fetch(base+'config.json').then(function(r){return r.json();}),
    fetch(base+'bunches.json').then(function(r){return r.json();}),
    fetch(base+'sfdc.json').then(function(r){return r.json();}),
    fetch(base+'christine.json').then(function(r){return r.json();}),
    fetch(base+'definitions.json').then(function(r){return r.json();}),
    fetch(base+'buyers.json').then(function(r){return r.json();}),
    fetch(base+'sell_by_channel.json').then(function(r){return r.json();}),
    fetch(base+'buyer_concentration.json').then(function(r){return r.json();}),
    fetch(base+'repeat_rate.json').then(function(r){return r.json();}),
    fetch(base+'supply_matrix_full.json').then(function(r){return r.json();}),
  ]);
  ACCOUNTS=results[0]; METRICS=results[1]; CONFIG=results[2]; BUNCHES=results[3]; SFDC=results[4]; CHRISTINE=results[5]; DEFINITIONS=results[6];
  BUYERS=results[7]; SELL_BY_CHANNEL=results[8]; BUYER_CONCENTRATION=results[9]; REPEAT_RATE=results[10]; SUPPLY_MATRIX=results[11];
  populateRepFilter();
  renderAccounts();
  renderEnablement();
  renderDefinitions();
}

// ─── HELPERS ────────────────────────────────────────────────
function fmt$(v) { if(v==null||v===undefined||isNaN(v)) return '\u2014'; if(v>=1e6) return '$'+(v/1e6).toFixed(1)+'M'; if(v>=1e3) return '$'+(v/1e3).toFixed(0)+'K'; return '$'+v.toFixed(0); }
function fmtN(v) { if(v==null||v===undefined) return '\u2014'; if(v>=1e6) return (v/1e6).toFixed(1)+'M'; if(v>=1e3) return (v/1e3).toFixed(1)+'K'; return v.toString(); }
function fmtPct(v) { if(v==null||v===undefined||isNaN(v)) return '\u2014'; return v.toFixed(1)+'%'; }

var PRIORITY_ORDER = {TA:0, IMPL:1, P1:2, CS_P2:3, WATCH:4, CS_TRACKED:5, ECOSYSTEM:6};
var PRIORITY_LABELS = {TA:'TA', IMPL:'IMPL', P1:'P1', CS_P2:'CS P2', WATCH:'WATCH', CS_TRACKED:'CS Tracked', ECOSYSTEM:'Ecosystem'};

// Map priority_level to P0/P1/P2/P3
function mapPriority(p) {
  if(p === 'TA' || p === 'IMPL') return 'P0';
  if(p === 'P1') return 'P1';
  if(p === 'CS_P2') return 'P2';
  if(p === 'WATCH' || p === 'CS_TRACKED') return 'P3';
  return 'P3'; // ECOSYSTEM and others default to P3
}
var MAPPED_PRIORITY_ORDER = {P0:0, P1:1, P2:2, P3:3};

function priorityBadge(p) {
  var mapped = mapPriority(p);
  var label = mapped;
  return '<span class="badge badge-'+mapped+'" title="'+PRIORITY_LABELS[p]+'">'+label+'</span>';
}

function stageBadge(s) { if(!s) return '\u2014'; return '<span class="stage stage-'+s+'">'+s.replace(/_/g,' ')+'</span>'; }

// ─── PRODUCT BADGES ─────────────────────────────────────────
function productBadges(acct) {
  var badges = [];
  if(acct.is_esuite) {
    badges.push('<span class="prod-badge prod-esuite">eSuite</span>');
  } else if(acct.system_type && acct.system_type.toLowerCase().includes('core')) {
    badges.push('<span class="prod-badge prod-core">Core</span>');
  }
  if(acct.has_procurement) badges.push('<span class="prod-badge prod-proc">Proc</span>');
  if(acct.has_eshops) badges.push('<span class="prod-badge prod-eshop">eShop</span>');
  return badges.length ? badges.join('') : '\u2014';
}

// ─── REP ASSIGNMENTS ────────────────────────────────────────
function getRep(acct) {
  var id = acct.company_id;
  if(!id) return 'Unassigned';
  if(CHRISTINE[id]) return 'Christian';
  if(acct.name && (acct.name.includes('Dreisbach') || acct.name.includes('Penn Valley') || acct.name.includes('Cleveland'))) return 'Santiago';
  if(acct.name && (acct.name.includes('EZ flowers') || acct.name.includes('Algro') || acct.name.includes('J Van Vliet') || acct.name.includes('GOMEZ') || acct.name.includes('Kontiki') || acct.name.includes('FGS'))) return 'Catalina';
  if(acct.name && (acct.name.includes('Avon Valley') || acct.name.includes('Price'))) return 'Dave';
  return 'Unassigned';
}

// ─── TRAFFIC LIGHT LOGIC ────────────────────────────────────
// Returns {icon, color, cls, score} where score is for sorting (0=red,1=amber,2=green)
function configTrafficLight(id, acct) {
  var cfg = CONFIG[id];
  if(!cfg) return {icon:'\u2014', cls:'', score:-1};
  // GATE: max_age=0 or null
  if(cfg.max_age === 0 || cfg.max_age === null) return {icon:'\u274c', cls:'tl tl-red', score:0};
  // GATE: wholesaler without eShop
  if(!acct.has_eshops && (acct.ct_id === 'WH_CORE' || acct.ct_id === 'WH_ESUITE')) return {icon:'\u274c', cls:'tl tl-red', score:0};
  // WARN: bunches=false or future=false for Core
  if(!cfg.bunches_flag && (acct.ct_id === 'WH_CORE' || acct.ct_id === 'WH_ESUITE')) return {icon:'\u26a0\ufe0f', cls:'tl tl-amber', score:1};
  if(!cfg.future && acct.ct_id === 'WH_CORE') return {icon:'\u26a0\ufe0f', cls:'tl tl-amber', score:1};
  return {icon:'\u2705', cls:'tl tl-green', score:2};
}

function buyTrafficLight(met) {
  if(!met) return {icon:'\ud83d\udd34', cls:'tl tl-red', score:0};
  var s = met.buy_stage;
  if(s === 'SCALE' || s === 'HABIT') return {icon:'\ud83d\udfe2', cls:'tl tl-green', score:2};
  if(s === 'ACTIVATING') return {icon:'\ud83d\udfe1', cls:'tl tl-amber', score:1};
  return {icon:'\ud83d\udd34', cls:'tl tl-red', score:0};
}

function listTrafficLight(met, cfg, acct) {
  if(!met && !cfg) return {icon:'\ud83d\udd34', cls:'tl tl-red', score:0};
  // No eShop = red
  if(!acct.has_eshops) return {icon:'\ud83d\udd34', cls:'tl tl-red', score:0};
  if(met && met.list_stage) {
    var s = met.list_stage;
    if(s === 'HEALTHY' || s === 'STRONG') return {icon:'\ud83d\udfe2', cls:'tl tl-green', score:2};
    if(s === 'GROWING' || s === 'ACTIVATING') return {icon:'\ud83d\udfe1', cls:'tl tl-amber', score:1};
    if(s === 'ESHOP_NO_FEATURES' || s === 'NO_ESHOP') return {icon:'\ud83d\udd34', cls:'tl tl-red', score:0};
  }
  // Fallback: check config features
  if(cfg) {
    if(!cfg.bunches_flag && !cfg.future) return {icon:'\ud83d\udd34', cls:'tl tl-red', score:0};
    if(!cfg.bunches_flag || !cfg.future) return {icon:'\ud83d\udfe1', cls:'tl tl-amber', score:1};
    return {icon:'\ud83d\udfe2', cls:'tl tl-green', score:2};
  }
  return {icon:'\ud83d\udd34', cls:'tl tl-red', score:0};
}

function sellTrafficLight(met) {
  if(!met) return {icon:'\ud83d\udd34', cls:'tl tl-red', score:0};
  var s = met.sell_stage;
  if(s === 'HEALTHY' || s === 'STRONG') return {icon:'\ud83d\udfe2', cls:'tl tl-green', score:2};
  if(s === 'GROWING' || s === 'MINIMAL') return {icon:'\ud83d\udfe1', cls:'tl tl-amber', score:1};
  return {icon:'\ud83d\udd34', cls:'tl tl-red', score:0};
}

// ─── OPPORTUNITY GENERATOR ──────────────────────────────────
function getOpportunities(acct) {
  var id = acct.company_id;
  if(!id) return [];
  var cfg = CONFIG[id];
  var met = METRICS[id];
  var bun = BUNCHES[id];
  var opps = [];
  // Config gaps
  if(cfg) {
    if((cfg.max_age === 0 || cfg.max_age === null)) {
      opps.push({text:'MaxAge=0/null. GATE fail. 5-min fix.', type:'config'});
    } else if(cfg.max_age !== null && cfg.max_age <= 10 && (acct.ct_id === 'WH_CORE' || acct.ct_id === 'WH_ESUITE')) {
      opps.push({text:'MaxAge='+cfg.max_age+'d. Benchmark: 300. 5-min fix.', type:'config'});
    }
    if(!cfg.bunches_flag && (acct.ct_id === 'WH_CORE' || acct.ct_id === 'WH_ESUITE')) {
      var bunchGMV = bun && bun.sells_bunches ? fmt$(bun.total_bunch_gmv)+' bunch GMV offline' : '';
      opps.push({text:'Bunches OFF.'+(bunchGMV ? ' '+bunchGMV+'.' : '')+' 5-min fix.', type:'config'});
    }
    if(!cfg.future && acct.ct_id === 'WH_CORE') {
      opps.push({text:'Future Sales OFF. eShop shows today only.', type:'config'});
    }
  }
  // Buy gaps
  if(met) {
    if(met.buy_stage === 'NO_CONNECTIONS' || met.buy_stage === 'CONNECTIONS_NO_BUY') {
      opps.push({text:'BUY stage: '+met.buy_stage.replace(/_/g,' ')+'. Needs activation.', type:'buy'});
    }
    if(met.k2k_total > 0 && met.k2k_active / met.k2k_total < 0.7) {
      var inactive = met.k2k_total - met.k2k_active;
      opps.push({text:inactive+'/'+met.k2k_total+' K2K inactive. Reactivation opp.', type:'buy'});
    }
  }
  // Sell gaps
  if(met) {
    if(met.online_pct < 5 && met.sell_total > 100000) {
      opps.push({text:fmtPct(met.online_pct)+' online of '+fmt$(met.sell_total)+'. '+fmt$(met.sell_offline)+' at $0 fees.', type:'sell'});
    }
  }
  if(!acct.has_eshops && (acct.ct_id === 'WH_CORE' || acct.ct_id === 'WH_ESUITE')) {
    opps.push({text:'No eShop. Cannot sell online.', type:'sell'});
  }
  return opps;
}

// ─── SFDC MATCH ─────────────────────────────────────────────
function getSFDC(acct) {
  if(!acct.name) return [];
  var name = acct.name.toLowerCase().replace(/[^a-z0-9]/g,'');
  return SFDC.filter(function(o) {
    var on = o.account_name.toLowerCase().replace(/[^a-z0-9]/g,'');
    return name.includes(on) || on.includes(name) || (name.length > 5 && on.includes(name.substring(0,8)));
  });
}

// ─── LOOKUP HELPERS FOR NEW DATA ────────────────────────────
function findBuyerData(companyId) {
  if(!companyId || !BUYERS.length) return null;
  return BUYERS.find(function(b){ return b.company_id === companyId; });
}
function findConcentration(companyId) {
  if(!companyId || !BUYER_CONCENTRATION.accounts) return null;
  return BUYER_CONCENTRATION.accounts.find(function(b){ return b.company_name; /* match below */ });
}
function findConcentrationByName(name) {
  if(!name || !BUYER_CONCENTRATION.accounts) return null;
  var n = name.toLowerCase().replace(/[^a-z0-9]/g,'');
  return BUYER_CONCENTRATION.accounts.find(function(b){
    var bn = b.company_name.toLowerCase().replace(/[^a-z0-9]/g,'');
    return bn === n || bn.includes(n) || n.includes(bn);
  });
}

    var rn = r.company_name.toLowerCase().replace(/[^a-z0-9]/g,'');
    return rn === n || rn.includes(n) || n.includes(rn);

}
function findSupplyBuy(name) {

// ─── BOTTLENECK COMPUTATION ─────────────────────────────────
function computeBottleneck(acct, cfg, met) {
  // GATE -> BREADTH -> DEPTH -> FORMAT -> BUYERS -> COMPETITIVE
  if(cfg && (cfg.max_age === 0 || cfg.max_age === null)) return 'GATE';
  if(!acct.has_eshops && (acct.ct_id === 'WH_CORE' || acct.ct_id === 'WH_ESUITE')) return 'GATE';
  if(cfg && !cfg.bunches_flag) return 'FORMAT';
  if(met && (met.buy_stage === 'NO_CONNECTIONS' || met.buy_stage === 'CONNECTIONS_NO_BUY')) return 'BREADTH';
  if(met && met.buy_stage === 'ACTIVATING') return 'DEPTH';
  var buyerData = findBuyerData(acct.company_id);
  if(buyerData && buyerData.online_buyers < 10) return 'BUYERS';
  if(met && met.sell_stage === 'NO_ONLINE_SALES') return 'COMPETITIVE';
  return '\u2014';
}

}

// ─── SORT STATE ─────────────────────────────────────────────
var sortCol = 'priority_mapped';
var sortDir = 1;

// ─── RENDER ACCOUNTS (TABLE) ────────────────────────────────
function renderAccounts() {
  var rep = document.getElementById('repFilter').value;
  var search = document.getElementById('searchInput').value.toLowerCase();
  var priority = document.getElementById('priorityFilter').value;
  var cfgFilter = document.getElementById('configFilter').value;
  var buyFilter = document.getElementById('buyFilter').value;
  var listFilterVal = document.getElementById('listFilter').value;
  var sellFilter = document.getElementById('sellFilter').value;
  var implFilter = document.getElementById('implFilter').value;

  var filtered = ACCOUNTS.filter(function(a) {
    var mapped = mapPriority(a.priority_level);
    // Default: exclude ECOSYSTEM (accounts with no meaningful priority)
    if(priority === 'EXCLUDE_ECO' && a.priority_level === 'ECOSYSTEM') return false;
    if(priority !== 'ALL' && priority !== 'EXCLUDE_ECO' && mapped !== priority) return false;
    if(rep !== 'all' && getRep(a) !== rep) return false;
    if(search && !(a.name||'').toLowerCase().includes(search) && !(a.company_id||'').includes(search)) return false;
    // Traffic light filters
    if(cfgFilter !== 'ALL') {
      var ct = configTrafficLight(a.company_id, a);
      if(cfgFilter === 'pass' && ct.score !== 2) return false;
      if(cfgFilter === 'warn' && ct.score !== 1) return false;
      if(cfgFilter === 'fail' && ct.score !== 0) return false;
    }
    if(buyFilter !== 'ALL') {
      var bt = buyTrafficLight(METRICS[a.company_id]);
      if(buyFilter === 'green' && bt.score !== 2) return false;
      if(buyFilter === 'yellow' && bt.score !== 1) return false;
      if(buyFilter === 'red' && bt.score !== 0) return false;
    }
    if(listFilterVal !== 'ALL') {
      var lt = listTrafficLight(METRICS[a.company_id], CONFIG[a.company_id], a);
      if(listFilterVal === 'green' && lt.score !== 2) return false;
      if(listFilterVal === 'yellow' && lt.score !== 1) return false;
      if(listFilterVal === 'red' && lt.score !== 0) return false;
    }
    if(sellFilter !== 'ALL') {
      var st = sellTrafficLight(METRICS[a.company_id]);
      if(sellFilter === 'green' && st.score !== 2) return false;
      if(sellFilter === 'yellow' && st.score !== 1) return false;
      if(sellFilter === 'red' && st.score !== 0) return false;
    }
    if(implFilter !== 'ALL') {
      var impl = CHRISTINE[a.company_id];
      if(!impl) return false;
      if(impl.stage !== implFilter) return false;
    }
    return true;
  });

  // Enrich for sorting
  filtered = filtered.map(function(a) {
    var id = a.company_id;
    var m = id ? METRICS[id] : null;
    var cfg = id ? CONFIG[id] : null;
    var ct = configTrafficLight(id, a);
    var bt = buyTrafficLight(m);
    var lt = listTrafficLight(m, cfg, a);
    var st = sellTrafficLight(m);
    var opps = getOpportunities(a);
    return Object.assign({}, a, {
      _m: m,
      _cfg: cfg,
      rep: getRep(a),
      priority_mapped: mapPriority(a.priority_level),
      config_score: ct.score,
      buy_score: bt.score,
      list_score: lt.score,
      sell_score: st.score,
      opp_count: opps.length,
      _opps: opps,
      _ct: ct, _bt: bt, _lt: lt, _st: st,
    });
  });

  // Sort
  filtered.sort(function(a, b) {
    if(sortCol === 'priority_mapped') {
      var pa = MAPPED_PRIORITY_ORDER[a.priority_mapped] != null ? MAPPED_PRIORITY_ORDER[a.priority_mapped] : 99;
      var pb = MAPPED_PRIORITY_ORDER[b.priority_mapped] != null ? MAPPED_PRIORITY_ORDER[b.priority_mapped] : 99;
      if(pa !== pb) return (pa - pb) * sortDir;
      return ((a.name||'').localeCompare(b.name||''));
    }
    var va = a[sortCol], vb = b[sortCol];
    if(typeof va === 'string') { va = (va||'').toLowerCase(); vb = (vb||'').toLowerCase(); }
    if(va < vb) return -1 * sortDir;
    if(va > vb) return 1 * sortDir;
    return 0;
  });

  var tbody = document.getElementById('accountsBody');
  var tfoot = document.getElementById('accountsFoot');
  var html = '';

  filtered.forEach(function(a, i) {
    var id = a.company_id;
    var met = a._m;
    var cfg = a._cfg;
    var ct = a._ct;
    var bt = a._bt;
    var lt = a._lt;
    var st = a._st;
    var opps = a._opps;
    var sfdcMatches = getSFDC(a);
    var impl = id ? CHRISTINE[id] : null;

    // SFDC product type
    var sfdcType = '\u2014';
    if(sfdcMatches.length > 0) {
      sfdcType = '<span style="color:var(--blue);font-size:11px" title="'+sfdcMatches.map(function(o){return o.opp_name;}).join(', ')+'">' +
        (sfdcMatches[0].type || sfdcMatches[0].stage || 'Opp') +
        (sfdcMatches.length > 1 ? ' +' + (sfdcMatches.length-1) : '') + '</span>';
    }

    // Opp count badge
    var oppBadge = opps.length > 0
      ? '<span class="opp-count has-opps" title="'+opps.map(function(o){return o.text;}).join('\n')+'">'+opps.length+'</span>'
      : '<span class="opp-count no-opps">0</span>';

    // Main row
    html += '<tr data-idx="'+i+'">';
    html += '<td><span class="expand-btn" data-idx="'+i+'">&#9654;</span></td>';
    html += '<td style="font-weight:600;white-space:nowrap">'+(a.name || '\u2014')+'</td>';
    html += '<td style="font-size:11px;white-space:nowrap">'+a.rep+'</td>';
    html += '<td>'+priorityBadge(a.priority_level)+'</td>';
    html += '<td style="white-space:nowrap">'+productBadges(a)+'</td>';
    html += '<td style="text-align:center"><span class="'+ct.cls+'">'+ct.icon+'</span></td>';
    html += '<td style="text-align:center"><span class="'+bt.cls+'">'+bt.icon+'</span></td>';
    html += '<td style="text-align:center"><span class="'+lt.cls+'">'+lt.icon+'</span></td>';
    html += '<td style="text-align:center"><span class="'+st.cls+'">'+st.icon+'</span></td>';
    html += '<td>'+sfdcType+'</td>';
    html += '<td style="text-align:center">'+oppBadge+'</td>';
    html += '</tr>';

    // Expand row
    html += '<tr class="expand-row" data-expand="'+i+'"><td colspan="11"><div class="expand-cell"><div class="expand-grid">';

    // Section 1: GMV & Revenue
    html += '<div class="expand-section"><h4>GMV & Revenue</h4>';
    html += '<div class="detail-row"><span class="detail-label">Est. GMV Sell</span><span>'+(a.annual_sales_est ? fmt$(a.annual_sales_est) : '\u2014')+'</span></div>';
    html += '<div class="detail-row"><span class="detail-label">Koronet Sell GMV</span><span>'+(met ? fmt$(met.sell_total) : '\u2014')+'</span></div>';
    html += '<div class="detail-row"><span class="detail-label">Online Sell %</span><span style="color:'+(met && met.online_pct >= 20 ? 'var(--green)' : met && met.online_pct > 0 ? 'var(--amber)' : 'var(--red)')+'">'+(met ? fmtPct(met.online_pct) : '\u2014')+'</span></div>';
    html += '<div class="detail-row"><span class="detail-label">Koronet Buy GMV</span><span>'+(met ? fmt$(met.proc_total) : '\u2014')+'</span></div>';
    var buyOnlinePct = met && met.proc_total > 0 ? (met.proc_online / met.proc_total * 100) : 0;
    html += '<div class="detail-row"><span class="detail-label">Online Buy %</span><span>'+(met ? fmtPct(buyOnlinePct) : '\u2014')+'</span></div>';
    html += '</div>';

    // Section 2: Buyers & Sustainability
    var buyerData = findBuyerData(id);
    var concData = findConcentrationByName(a.name);
    var repeatData = findRepeatRate(a.name);
    html += '<div class="expand-section"><h4>Buyers & Sustainability</h4>';
    html += '<div class="detail-row"><span class="detail-label">Buyers</span><span>'+(buyerData ? buyerData.total_buyers+' total / '+buyerData.online_buyers+' online' : '\u2014')+'</span></div>';
    html += '<div class="detail-row"><span class="detail-label">Repeat Rate</span><span>'+(repeatData ? fmtPct(repeatData.repeat_rate_pct) : '\u2014')+'</span></div>';
    html += '<div class="detail-row"><span class="detail-label">Concentration (top 2)</span><span style="color:'+(concData && concData.top2_pct > 25 ? 'var(--red)' : concData && concData.top2_pct > 15 ? 'var(--amber)' : 'var(--green)')+'">'+(concData ? fmtPct(concData.top2_pct) : '\u2014')+'</span></div>';
    if(concData) {
      html += '<div class="detail-row"><span class="detail-label">#1 Buyer</span><span style="font-size:11px">'+concData.top1_name+' ('+fmt$(concData.top1_gmv)+')</span></div>';
      html += '<div class="detail-row"><span class="detail-label">#2 Buyer</span><span style="font-size:11px">'+(concData.top2_name||'\u2014')+' ('+fmt$(concData.top2_gmv_2)+')</span></div>';
    }
    html += '</div>';

    // Section 3: Supply Coverage
    var supBuy = findSupplyBuy(a.name);
    var supSell = findSupplySell(a.name);
    var gapCat = findGapCategories(a.name);
    html += '<div class="expand-section"><h4>Supply Coverage</h4>';
    if(supBuy) {
      var buyCov = supBuy.total_categories_bought > 0 ? (supBuy.online_categories_bought / supBuy.total_categories_bought * 100) : 0;
      html += '<div class="detail-row"><span class="detail-label">BUY Coverage</span><span>'+supBuy.online_categories_bought+'/'+supBuy.total_categories_bought+' ('+fmtPct(buyCov)+')</span></div>';
    } else {
      html += '<div class="detail-row"><span class="detail-label">BUY Coverage</span><span>\u2014</span></div>';
    }
    if(supSell) {
      var sellCov = supSell.total_categories_sold > 0 ? (supSell.online_categories_sold / supSell.total_categories_sold * 100) : 0;
      html += '<div class="detail-row"><span class="detail-label">SELL Coverage</span><span>'+supSell.online_categories_sold+'/'+supSell.total_categories_sold+' ('+fmtPct(sellCov)+')</span></div>';
    } else {
      html += '<div class="detail-row"><span class="detail-label">SELL Coverage</span><span>\u2014</span></div>';
    }
    html += '<div class="detail-row"><span class="detail-label">Gap Categories</span><span>'+(gapCat ? gapCat.gap_categories+' categories' : '\u2014')+'</span></div>';
    html += '</div>';

    // Section 4: Bottleneck & Actions
    var bottleneck = computeBottleneck(a, cfg, met);
    var nextAction = opps.length > 0 ? opps[0].text : '\u2014';
    html += '<div class="expand-section"><h4>Bottleneck & Actions</h4>';
    html += '<div class="detail-row"><span class="detail-label">Bottleneck</span><span style="font-weight:600;color:'+(bottleneck === 'GATE' ? 'var(--red)' : bottleneck === '\u2014' ? 'var(--text-muted)' : 'var(--amber)')+'">'+bottleneck+'</span></div>';
    html += '<div class="detail-row"><span class="detail-label">Next Action</span><span style="font-size:11px">'+nextAction+'</span></div>';
    if(opps.length > 1) {
      html += '<div style="margin-top:4px;font-size:11px;color:var(--text-muted)">';
      opps.slice(1).forEach(function(o) {
        html += '<div>\u2022 '+o.text+'</div>';
      });
      html += '</div>';
    }
    html += '</div>';

    // Section 5: Channel Mix
    var channels = findChannelMix(a.name);
    html += '<div class="expand-section"><h4>Channel Mix</h4>';
    if(channels && channels.length > 0) {
      var totalGmv = channels.reduce(function(s, c){ return s + c.channel_gmv; }, 0);
      channels.forEach(function(c) {
        var pct = totalGmv > 0 ? (c.channel_gmv / totalGmv * 100) : 0;
        html += '<div class="detail-row"><span class="detail-label">'+c.sales_channel+'</span><span>'+fmt$(c.channel_gmv)+' ('+fmtPct(pct)+')</span></div>';
      });
    } else {
      html += '<div class="detail-row"><span class="detail-label">\u2014</span><span>No channel data</span></div>';
    }
    html += '</div>';

    // Section 6: Bunches & Config
    var bun = id ? BUNCHES[id] : null;
    html += '<div class="expand-section"><h4>Bunches & Config</h4>';
    if(bun) {
      html += '<div class="detail-row"><span class="detail-label">Bunch GMV</span><span>'+fmt$(bun.total_bunch_gmv)+'</span></div>';
      html += '<div class="detail-row"><span class="detail-label">Flag</span><span style="color:'+(bun.bunches_flag ? 'var(--green)' : 'var(--red)')+'">'+(bun.bunches_flag ? 'ON' : 'OFF')+'</span></div>';
      if(bun.discrepancy) {
        html += '<div class="detail-row"><span class="detail-label">Discrepancy</span><span style="color:var(--red);font-weight:600">Sells bunches but flag OFF</span></div>';
      }
    } else {
      html += '<div class="detail-row"><span class="detail-label">\u2014</span><span>No bunch data</span></div>';
    }
    if(cfg) {
      html += '<div class="detail-row"><span class="detail-label">MaxAge</span><span style="color:'+(cfg.max_age && cfg.max_age >= 30 ? 'var(--green)' : cfg.max_age && cfg.max_age > 0 ? 'var(--amber)' : 'var(--red)')+'">'+(cfg.max_age != null ? cfg.max_age+'d' : 'null')+'</span></div>';
      html += '<div class="detail-row"><span class="detail-label">Future Sales</span><span style="color:'+(cfg.future ? 'var(--green)' : 'var(--red)')+'">'+(cfg.future ? 'ON' : 'OFF')+'</span></div>';
    }
    html += '</div>';

    // Section 7: SFDC
    if(sfdcMatches.length) {
      html += '<div class="expand-section"><h4>SFDC Opportunities</h4>';
      sfdcMatches.forEach(function(o) {
        html += '<div class="detail-row"><span class="detail-label">'+o.stage+'</span><span>'+o.opp_name+' \u2014 '+fmt$(o.amount)+(o.close_date ? ' \u00b7 close '+o.close_date : '')+'</span></div>';
      });
      html += '</div>';
    }

    // Section 8: Implementation
    if(impl) {
      html += '<div class="expand-section"><h4>Implementation</h4>';
      html += '<div class="detail-row"><span class="detail-label">Stage</span><span>'+(impl.stage || '\u2014')+'</span></div>';
      html += '<div class="detail-row"><span class="detail-label">Type</span><span>'+(impl.type || '\u2014')+'</span></div>';

      if(impl.days_live != null) html += '<div class="detail-row"><span class="detail-label">Days Live</span><span>'+impl.days_live+'</span></div>';
      if(impl.note) html += '<div class="detail-row"><span class="detail-label">Note</span><span>'+impl.note+'</span></div>';
      html += '</div>';
    }

    html += '</div></div></td></tr>';
  });

  tbody.innerHTML = html;

  // Total row
  tfoot.innerHTML = '<tr class="total-row">' +
    '<td></td><td>TOTAL ('+filtered.length+' accounts)</td>' +
    '<td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td>' +
    '</tr>';

  document.getElementById('filterCount').textContent = filtered.length+' of '+ACCOUNTS.length+' accounts';

  // Bind expand buttons
  document.querySelectorAll('.expand-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var idx = this.dataset.idx;
      var row = document.querySelector('tr[data-expand="'+idx+'"]');
      this.classList.toggle('open');
      row.classList.toggle('open');
    });
  });
}

// ─── ENABLEMENT ─────────────────────────────────────────────

// ─── DEFINITIONS ────────────────────────────────────────────
function renderDefinitions() {
  var el = document.getElementById('tab-definitions');
  var html = '';

  // Product types
  html += '<div class="def-section"><h3>Product Types</h3><div class="def-grid">';
  Object.entries(DEFINITIONS.product_types).forEach(function(entry) {
    var pt = entry[1];
    html += '<div class="def-card"><h4>'+pt.display+'</h4><p>'+pt.desc+'</p>'+(pt.examples ? '<p style="margin-top:4px"><strong>Examples:</strong> '+pt.examples+'</p>' : '')+'</div>';
  });
  html += '</div></div>';

  // Trust journey
  html += '<div class="def-section"><h3>Trust Journey</h3><div class="def-grid">';
  DEFINITIONS.trust_journey.forEach(function(step) {
    html += '<div class="def-card"><h4>Step '+step.step+': '+step.name+'</h4><p>'+step.desc+'</p><p style="margin-top:4px"><strong>Action:</strong> '+step.action+'</p></div>';
  });
  html += '</div></div>';

  // Abbreviations
  html += '<div class="def-section"><h3>Abbreviations</h3><div class="abbr-grid">';
  Object.entries(DEFINITIONS.abbreviations).forEach(function(entry) {
    html += '<span class="abbr-key">'+entry[0]+'</span><span>'+entry[1]+'</span>';
  });
  html += '</div></div>';

  el.innerHTML = html;
}

// ─── TAB SWITCHING ──────────────────────────────────────────
document.getElementById('mainTabs').addEventListener('click', function(e) {
  var tab = e.target.closest('.tab');
  if(!tab) return;
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active');});
  document.querySelectorAll('.tab-content').forEach(function(t){t.classList.remove('active');});
  tab.classList.add('active');
  document.getElementById('tab-'+tab.dataset.tab).classList.add('active');
});

document.getElementById('enSubTabs').addEventListener('click', function(e) {
  var tab = e.target.closest('.sub-tab');
  if(!tab) return;
  document.querySelectorAll('.sub-tab').forEach(function(t){t.classList.remove('active');});
  document.querySelectorAll('.sub-content').forEach(function(t){t.classList.remove('active');});
  tab.classList.add('active');
  document.getElementById('sub-'+tab.dataset.sub).classList.add('active');
});

// ─── SORT HANDLING ──────────────────────────────────────────
document.querySelectorAll('th[data-sort]').forEach(function(th) {
  th.addEventListener('click', function() {
    var col = this.dataset.sort;
    if(sortCol === col) { sortDir *= -1; } else { sortCol = col; sortDir = 1; }
    document.querySelectorAll('th').forEach(function(h){h.classList.remove('sorted');});
    this.classList.add('sorted');
    this.querySelector('.sort-arrow').innerHTML = sortDir === 1 ? '&#9650;' : '&#9660;';
    renderAccounts();
  });
});

// ─── FILTER EVENTS ──────────────────────────────────────────
document.getElementById('repFilter').addEventListener('change', renderAccounts);
document.getElementById('searchInput').addEventListener('input', renderAccounts);
document.getElementById('priorityFilter').addEventListener('change', renderAccounts);
